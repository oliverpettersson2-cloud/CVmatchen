<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Något gick fel — CVmatchen</title>
  <link rel="icon" href="/pathfinder-favicon.svg">
  <style>
    :root { --bg: #f5f2eb; --accent: #e85d26; --ink: #2a2a2a; }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .card { max-width: 460px; }
    .code { font-size: 88px; font-weight: 800; color: var(--accent); line-height: 1; }
    h1 { font-size: 24px; margin: 16px 0 8px; }
    p { font-size: 16px; color: #555; margin-bottom: 24px; }
    a.btn {
      display: inline-block; background: var(--accent); color: #fff;
      text-decoration: none; font-weight: 600; padding: 12px 28px;
      border-radius: 8px; font-size: 16px;
    }
    a.btn:hover { filter: brightness(0.93); }
    a.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">500</div>
    <h1>Något gick fel</h1>
    <p>Ett tekniskt fel inträffade. Försök igen om en stund — felet är loggat.</p>
    <a class="btn" href="/">Tillbaka till startsidan</a>
  </main>
</body>
</html>
